name: CI

on:
  push:
  pull_request:

env:
  # Pinned exact Godot 4.7 stable build. Do NOT float to "latest" — a silent
  # engine bump is the failure mode this pin exists to prevent.
  GODOT_VERSION: "4.7-stable"
  GODOT_RELEASE_TAG: "4.7-stable"
  GODOT_ARCHIVE: "Godot_v4.7-stable_linux.x86_64.zip"
  GODOT_BIN_NAME: "Godot_v4.7-stable_linux.x86_64"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot-bin
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-bin-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/${GODOT_ARCHIVE}"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x "$HOME/godot-bin/${GODOT_BIN_NAME}"

      - name: Cache .godot import folder
        uses: actions/cache@v4
        with:
          path: .godot
          # .import sidecars are untracked (only the customized font one is committed),
          # so the key hashes the asset sources themselves to stay change-sensitive.
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.import', '**/*.png', '**/*.svg', '**/*.ttf', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Resolve Godot binary path
        run: echo "GODOT=$HOME/godot-bin/${GODOT_BIN_NAME}" >> "$GITHUB_ENV"

      # Authoritative import pass: writes/refreshes res://.godot/global_script_class_cache.cfg
      # (required for bare class_name identifiers to resolve in test files) and imports every
      # asset under asset/**. Always runs, even on a .godot cache hit — a hit can carry a stale
      # cache from before new class_name scripts or assets landed, and `--import` (no --quit) is
      # the supported headless-import-and-exit mode; `--import --quit` was dropped because it
      # opens the editor and can exit before the class cache write is flushed to disk.
      - name: Import project (headless)
        timeout-minutes: 5
        run: |
          set -o pipefail
          # Imported TWICE on purpose. On a COLD .godot a resource can be parsed
          # before its dependency finishes importing — asset/ui_theme.tres
          # references the font and reports "Parse Error: referenced non-existent
          # resource" on the first pass, then resolves on the second. Before the
          # second pass landed, this job passed only because its .godot cache was
          # warm and a cache eviction would have failed main for something that is
          # not a real error. Proven by web-deploy run 32218173780, which started
          # with no cache at all.
          #
          # The old `import_exit=$?` after a pipe read tee's status, never
          # Godot's, so that guard could not fire. `set -o pipefail` above is
          # what actually fails the step on a non-zero Godot exit.
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::GDScript parse/script error survived a second import pass"
            exit 1
          fi

      - name: Run tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script tests/run_tests.gd 2>&1 | tee tests.log
          test_exit=$?
          if grep -Eq "SCRIPT ERROR|Parse Error" tests.log; then
            echo "::error::GDScript parse/script error detected in test run"
            exit 1
          fi
          if [ "$test_exit" -ne 0 ]; then
            echo "::error::tests/run_tests.gd exited with status $test_exit"
            exit 1
          fi

      - name: Validate data (skipped if validator not landed yet)
        timeout-minutes: 5
        run: |
          set -o pipefail
          if [ ! -f tools/validate_data.gd ]; then
            echo "::warning::tools/validate_data.gd not found yet — skipping data validation step"
            exit 0
          fi
          "$GODOT" --headless --path . --script tools/validate_data.gd 2>&1 | tee validate.log
          validate_exit=$?
          if grep -Eq "SCRIPT ERROR|Parse Error" validate.log; then
            echo "::error::GDScript parse/script error detected in data validation"
            exit 1
          fi
          if [ "$validate_exit" -ne 0 ]; then
            echo "::error::tools/validate_data.gd exited with status $validate_exit"
            exit 1
          fi

      # The unit suite cannot see anything that only exists once a scene is
      # running: a held tutorial, a swallowed touch, a projectile that never
      # leaves. Those live in the evidence harnesses, and until now nothing ran
      # them but a human — which is how n64_check sat red (the first-run guide
      # held its weapons) and pickup_check hung forever headless (it awaited a
      # frame that never draws) without anyone noticing.
      #
      # Every harness here self-asserts and exits non-zero on failure. They are
      # run in one step so a single red one does not hide the rest, and the
      # whole set costs about half a minute.
      - name: Run scene harnesses (headless)
        timeout-minutes: 6
        run: |
          # Without pipefail the `if !` below reads tee's status, never Godot's,
          # and every harness would look green no matter what it exited with.
          set -o pipefail
          failed=""
          for harness in creep_check meta_flow_check music_check n64_check \
                         pickup_check shadow_check tutorial_check unlocks_check endless_check nav_check; do
            echo "--- $harness"
            if ! "$GODOT" --headless --path . "res://tools/$harness.tscn" 2>&1 | tee "$harness.log"; then
              failed="$failed $harness"
            elif grep -Eq "SCRIPT ERROR|Parse Error" "$harness.log"; then
              echo "::error::$harness logged a script error"
              failed="$failed $harness"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::scene harnesses failed:$failed"
            exit 1
          fi
