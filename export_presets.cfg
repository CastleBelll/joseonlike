; Godot 4.7 export presets — JOSEONLIKE
;
; No secrets live in this file. Keystore paths/passwords, iOS signing identity,
; and provisioning profile UUIDs are intentionally left blank here and are
; injected at export time from environment variables via
; tools/ci/export.sh / tools/ci/export.ps1, which write a local, gitignored
; export_credentials.cfg (Godot's per-machine credentials store) before
; invoking `godot --export-*`. Never fill in real values in this file.

